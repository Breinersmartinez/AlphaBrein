apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: alphabrein-staging

resources:
  - ../../base

namePrefix: staging-

commonLabels:
  environment: staging
  app.kubernetes.io/environment: staging

patches:
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: alphabrein-backend
      spec:
        replicas: 1
        template:
          spec:
            containers:
              - name: backend
                resources:
                  requests:
                    memory: "256Mi"
                    cpu: "100m"
                  limits:
                    memory: "512Mi"
                    cpu: "500m"
    target:
      kind: Deployment
      labelSelector: app.kubernetes.io/name=alphabrein-backend

  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: alphabrein-frontend
      spec:
        replicas: 1
        template:
          spec:
            containers:
              - name: frontend
                resources:
                  requests:
                    memory: "64Mi"
                    cpu: "50m"
                  limits:
                    memory: "128Mi"
                    cpu: "250m"
    target:
      kind: Deployment
      labelSelector: app.kubernetes.io/name=alphabrein-frontend

  - patch: |-
      apiVersion: v1
      kind: Secret
      metadata:
        name: alphabrein-secrets
      stringData:
        URL_DB: "jdbc:postgresql://postgres-staging:5432/alphabrein"
        USER_NAME: "alphabrein_staging"
        PASSWORD_DB: "STAGING_PASSWORD"
        TOKEN_JWT: "STAGING_JWT_SECRET"
    target:
      kind: Secret
      name: alphabrein-secrets

images:
  - name: ghcr.io/alphabrein/alphabrein/backend
    newTag: staging-latest
  - name: ghcr.io/alphabrein/alphabrein/frontend
    newTag: staging-latest

replacements:
  - source:
      kind: Service
      name: alphabrein-backend
    targets:
      - select:
          kind: Ingress
        fieldPaths:
          - spec.rules[1].http.paths[0].backend.service.name
    options:
      create: true
  - source:
      kind: Service
      name: alphabrein-frontend
    targets:
      - select:
          kind: Ingress
        fieldPaths:
          - spec.rules[0].http.paths[0].backend.service.name
    options:
      create: true