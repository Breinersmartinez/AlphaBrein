apiVersion: v1
kind: Namespace
metadata:
  name: alphabrein
  labels:
    app.kubernetes.io/name: alphabrein
    app.kubernetes.io/part-of: alphabrein-platform
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: alphabrein-sa
  namespace: alphabrein
---
apiVersion: v1
kind: Secret
metadata:
  name: alphabrein-secrets
  namespace: alphabrein
type: Opaque
stringData:
  # These will be replaced by CI/CD
  URL_DB: "jdbc:postgresql://postgres:5432/alphabrein"
  USER_NAME: "alphabrein"
  PASSWORD_DB: "CHANGE_ME"
  TOKEN_JWT: "CHANGE_ME"
  USER_NAME_MAIL: ""
  APP_PASSWORD: ""
  N8N_WEBHOOK_URL: ""
  ACCESS_TOKEN: ""
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alphabrein-backend
  namespace: alphabrein
  labels:
    app.kubernetes.io/name: alphabrein-backend
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: alphabrein-platform
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: alphabrein-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: alphabrein-backend
        app.kubernetes.io/component: backend
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/actuator/prometheus"
    spec:
      serviceAccountName: alphabrein-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: backend
          image: ghcr.io/alphabrein/alphabrein/backend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - secretRef:
                name: alphabrein-secrets
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
---
apiVersion: v1
kind: Service
metadata:
  name: alphabrein-backend
  namespace: alphabrein
  labels:
    app.kubernetes.io/name: alphabrein-backend
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: alphabrein-backend
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alphabrein-frontend
  namespace: alphabrein
  labels:
    app.kubernetes.io/name: alphabrein-frontend
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: alphabrein-platform
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: alphabrein-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: alphabrein-frontend
        app.kubernetes.io/component: frontend
    spec:
      serviceAccountName: alphabrein-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        fsGroup: 101
      containers:
        - name: frontend
          image: ghcr.io/alphabrein/alphabrein/frontend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
              name: http
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: alphabrein-frontend
  namespace: alphabrein
  labels:
    app.kubernetes.io/name: alphabrein-frontend
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: alphabrein-frontend
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: alphabrein-ingress
  namespace: alphabrein
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - alphabrein.example.com
        - api.alphabrein.example.com
      secretName: alphabrein-tls
  rules:
    - host: alphabrein.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: alphabrein-frontend
                port:
                  number: 80
    - host: api.alphabrein.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: alphabrein-backend
                port:
                  number: 8080
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: alphabrein-backend-hpa
  namespace: alphabrein
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: alphabrein-backend
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 10
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 15
        - type: Pods
          value: 4
          periodSeconds: 15
      selectPolicy: Max
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: alphabrein-frontend-hpa
  namespace: alphabrein
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: alphabrein-frontend
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 70